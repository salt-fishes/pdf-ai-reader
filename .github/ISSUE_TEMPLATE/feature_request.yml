name: Feature request
description: 提议一个新功能或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不舒服？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以是交互、技术方案或参考产品
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 阅读器 / PDF 渲染
        - AI 助手 / 上下文
        - 长文档 / 总结
        - 设置 / 数据
        - OCR
        - 桌面版
        - 其他
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私
      options:
        - label: 这个功能不会默认上传整份 PDF
          required: true
