name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这不是安全问题；安全问题请按 SECURITY.md 私下报告。
        请勿上传真实 API Key、真实 PDF 或包含个人信息的对话截图。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 sample-cn.pdf
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 0.1.0 或 commit hash
  - type: dropdown
    id: environment
    attributes:
      label: 运行方式
      options:
        - 浏览器 + npm run dev:all
        - 浏览器 + npm start
        - Electron 桌面版
  - type: input
    id: os
    attributes:
      label: 系统 / 浏览器
      placeholder: Windows 11 · Edge 145
  - type: textarea
    id: logs
    attributes:
      label: 控制台 / 代理日志
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我确认没有包含真实密钥、真实 PDF 或私人对话
          required: true
