name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without publishing a GitHub release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MOCK_AI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron and ONNX Runtime binaries
        run: |
          node node_modules/electron/install.js
          node node_modules/onnxruntime-node/script/install.js
      - name: Check tag matches package.json
        if: github.event_name == 'push'
        run: node scripts/check-version.mjs ${{ github.ref_name }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run package:desktop
      - run: npm run package:ocr-pack
      - name: Zip portable app and OCR pack
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || 'dry-run' }}"
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/wenshu-$tag-win-x64.zip"
          Compress-Archive -Path release/ocr-pack/* -DestinationPath "release/wenshu-ocr-$tag-win-x64.zip"
      - name: Build NSIS and wrapped MSI installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/build-installers.mjs
      - name: Checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || 'dry-run' }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = @(
            "release/wenshu-$tag-win-x64.zip",
            "release/wenshu-ocr-$tag-win-x64.zip",
            "release/wenshu-v$version-x64.exe",
            "release/wenshu-v$version-x64.msi"
          ) | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $(Split-Path $_ -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt
      - name: Check package sizes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name || 'dry-run' }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = Get-Item "release/wenshu-$tag-win-x64.zip"
          $ocr = Get-Item "release/wenshu-ocr-$tag-win-x64.zip"
          $nsis = Get-Item "release/wenshu-v$version-x64.exe"
          $msi = Get-Item "release/wenshu-v$version-x64.msi"
          if ($zip.Length -gt 160MB) { throw "App zip is $([math]::Round($zip.Length/1MB))MB, budget is 160MB" }
          if ($ocr.Length -gt 60MB) { throw "OCR zip is $([math]::Round($ocr.Length/1MB))MB, budget is 60MB" }
          if ($nsis.Length -gt 160MB) { throw "NSIS is $([math]::Round($nsis.Length/1MB))MB, budget is 160MB" }
          if ($msi.Length -gt 160MB) { throw "MSI is $([math]::Round($msi.Length/1MB))MB, budget is 160MB" }
          if (($zip.Length + $ocr.Length) -gt 185MB) { throw "App + OCR zips are $([math]::Round(($zip.Length + $ocr.Length)/1MB))MB, budget is 185MB" }
      - name: Generate release notes
        run: node scripts/release-notes.mjs
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          body_path: release-notes.md
          files: |
            release/wenshu-${{ github.ref_name }}-win-x64.zip
            release/wenshu-ocr-${{ github.ref_name }}-win-x64.zip
            release/wenshu-${{ github.ref_name }}-x64.exe
            release/wenshu-${{ github.ref_name }}-x64.msi
            release/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
